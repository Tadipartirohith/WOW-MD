name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wow_user
          POSTGRES_PASSWORD: wow_password
          POSTGRES_DB: wow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wow_user -d wow_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: wow_user
      DB_PASSWORD: wow_password
      DB_NAME: wow_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      # The auth throttle exists to slow credential stuffing from one address.
      # The e2e suite registers a dozen accounts from one address in a few
      # seconds, which is not that threat — and with the production ceiling of
      # 10 the suite sat one new test away from failing on a 429 that had
      # nothing to do with the code under test. The limit itself is exercised
      # by scripts/verify-invites.sh, which drives it deliberately.
      AUTH_RATE_LIMIT_MAX: 100

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run migration:run
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The frontend suite was never run here, so the check that the client's
      # permission mirror still matches the backend enum only ever ran on a
      # developer's machine — which is the one place it does not need to.
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The bundle, not just the types.
      #
      # This app reads four modules out of frontend/src (the permission matrix,
      # notification wording, date formats, error parsing) and Metro resolves
      # them across a project boundary, where a file brings its own node_modules
      # rather than this app's. Type-checking cannot see that; only bundling
      # can. Renaming an export in the web client, or giving one of those
      # modules a dependency, breaks the app here and nowhere else — so it is
      # worth the two minutes.
      - run: npx expo export --platform android --output-dir /tmp/expo-ci

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build -f docker/Dockerfile -t wow-backend:ci ./backend
      - name: Build frontend production image
        run: docker build -f docker/Dockerfile.frontend -t wow-frontend:ci ./frontend
      # In a real pipeline: scan (Trivy), push to registry, run DB migration job, deploy.
