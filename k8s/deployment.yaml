apiVersion: apps/v1
kind: Deployment
metadata:
  name: wow-backend
  namespace: wow
  labels: { app: wow-backend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: wow-backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: wow-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: <REGISTRY>/wow-backend:latest   # set by CI to the built tag
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: wow-backend-config }
            - secretRef: { name: wow-backend-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
