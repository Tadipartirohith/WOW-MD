# Horizontal Pod Autoscaler, scales on CPU and requests-per-second.
# The RPS metric requires a metrics adapter (e.g. Prometheus Adapter) exposing
# `http_requests_per_second`. CPU alone works out of the box with metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wow-backend
  namespace: wow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wow-backend
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Pods
      pods:
        metric: { name: http_requests_per_second }
        target: { type: AverageValue, averageValue: "200" }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
